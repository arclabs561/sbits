[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "sbits"
version = "0.1.0"
description = "Succinct data structures: BitVector with O(1) rank/select, Elias-Fano, WaveletTree."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Arc", email = "attobop@gmail.com" }]
keywords = ["succinct", "bitvector", "rank-select", "elias-fano", "data-structures"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/arclabs561/sbits"
Documentation = "https://docs.rs/sbits"
Repository = "https://github.com/arclabs561/sbits"

[tool.maturin]
module-name = "sbits"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../Cargo.toml" },
    { file = "../src/**/*.rs" },
    { file = "src/**/*.rs" },
]

[project.optional-dependencies]
numpy = ["numpy>=1.21"]

[dependency-groups]
dev = [
    "numpy>=1.21",
    "pytest>=7.4.4",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]
