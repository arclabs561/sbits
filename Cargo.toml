[package]
name = "sbits"
version = "0.2.4"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
description = "Succinct data structures"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/sbits"
homepage = "https://github.com/arclabs561/sbits"
documentation = "https://docs.rs/sbits"
rust-version = "1.87"
readme = "README.md"
keywords = ["succinct", "bitvec", "rank-select"]
categories = ["data-structures", "algorithms", "no-std"]
include = ["/src", "/tests", "/examples", "/benches", "/README.md", "/CHANGELOG.md", "/LICENSE*"]

[workspace]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.5"
criterion = "0.8"
sucds = "0.8"
vers-vecs = "1.9"
sux = { version = "0.14", default-features = false }
serde_json = "1"

[[bench]]
name = "succ_bench"
harness = false

[[bench]]
name = "comparison"
harness = false
