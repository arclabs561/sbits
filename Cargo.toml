[package]
name = "sbits"
version = "0.1.3"
authors = ["Arc <attobop@gmail.com>"]
edition = "2021"
description = "Succinct data structures: near-optimal space with efficient queries."
license = "MIT OR Apache-2.0"
repository = "https://github.com/arclabs561/sbits"
homepage = "https://github.com/arclabs561/sbits"
documentation = "https://docs.rs/sbits"
readme = "README.md"
keywords = ["succinct", "bitvec", "rank-select"]
categories = ["data-structures", "algorithms", "no-std"]

[workspace]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1.5"
criterion = "0.5"

[[bench]]
name = "succ_bench"
harness = false
